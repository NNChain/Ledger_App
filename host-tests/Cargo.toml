[package]
name = "nnchain-host-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Host-side (x86) tests for the hardware independent parts of the app.
# Run from OUTSIDE the app directory so the device `.cargo/config.toml` is not picked up:
#   cd .. && cargo test --release --manifest-path <app>/host-tests/Cargo.toml

[workspace]
exclude = ["fuzz"]

[dependencies]
serde_json = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
bech32 = "0.11"
rand = "0.8"
hex = "0.4"

[profile.release]
debug-assertions = true
overflow-checks = true
