name: Build, functional tests and host tests

# Builds the app with Ledger's builder image for every device in ledger_app.toml and runs the
# ragger functional tests (with screenshot comparison) on Speculos, via Ledger's reusable workflows.
# Also runs the hardware independent unit / differential / fuzz tests on the CI runner.
# (Adapted from the Ledger Rust boilerplate. Not yet executed: needs the repository on GitHub.)

permissions:
  contents: write
  actions: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      golden_run:
        type: choice
        required: true
        default: 'Raise an error (default)'
        description: CI behavior if the test snapshots are different than expected.
        options:
          - 'Raise an error (default)'
          - 'Open a PR'
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  build_application:
    name: Build application using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      upload_app_binaries_artifact: "app_nnchain_binaries"
      builder: ledger-app-builder

  tests_standalone:
    name: Run standalone ragger tests using the reusable workflow
    needs: build_application
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_ragger_tests.yml@v1
    with:
      download_app_binaries_artifact: "app_nnchain_binaries"
      regenerate_snapshots: ${{ github.event_name == 'workflow_dispatch' && inputs.golden_run == 'Open a PR' }}
      test_dir: "tests/standalone"

  host_tests:
    name: Host-side unit, differential and fuzz tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Run from outside the repository: the app's .cargo/config.toml targets the device.
      - name: cargo test
        run: |
          cd "$RUNNER_TEMP"
          cargo test --release --manifest-path "$GITHUB_WORKSPACE/host-tests/Cargo.toml"
