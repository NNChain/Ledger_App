name: Ensure compliance with Ledger guidelines

# Mandatory for Ledger apps: calls Ledger's reusable guidelines enforcer.
# (Adapted from the Ledger Rust boilerplate. Not yet executed: needs the repository on GitHub.)

permissions:
  contents: read
  actions: write
  pull-requests: write
  packages: read

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  guidelines_enforcer:
    name: Call Ledger guidelines_enforcer
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_guidelines_enforcer.yml@v1
