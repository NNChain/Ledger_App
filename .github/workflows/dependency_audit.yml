name: Dependency audit (cargo-audit)

# Ledger requires the dependencies of Rust apps to be checked with cargo-audit.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/dependency_audit.yml'
  schedule:
    - cron: '0 6 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # call the binary directly so rustup does not install the repository's pinned nightly
      - name: cargo audit
        run: cargo-audit audit
