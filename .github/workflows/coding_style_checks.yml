name: Run coding style check

# Mandatory minimal linting through Ledger's reusable workflow, plus clippy on the device build.
# (Not yet executed: needs the repository on GitHub.)

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  check_linting:
    name: Check linting using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_lint.yml@v1
    with:
      source: './src'

  clippy:
    name: clippy (must report nothing)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo clippy
        run: cargo clippy --release --target flex -- -D warnings
